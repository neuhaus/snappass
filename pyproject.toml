[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "snappass"
version = "1.7.0"
description = "It's like SnapChat... for Passwords."
readme = "README.rst"
authors = [
    {name = "Pinterest", email = "joec@pinterest.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Flask>=3.1.0",
    "redis>=5.0.0",
    "Flask-Babel>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/pinterest/snappass"

[project.scripts]
snappass = "snappass.main:main"

[tool.ruff.lint]
select = ["E", "F", "S"]

[tool.ruff.lint.per-file-ignores]
"tests.py" = ["S105", "S101"]

[project.optional-dependencies]
dev = [
    "coverage==7.6.0",
    "fakeredis>=2.26.0",
    "ruff==0.6.2",
    "pip-audit==2.7.3",
    "freezegun==1.5.1",
    "pytest>=9.0.3",
    "pytest-cov==5.0.0",
    "tox==4.23.0",
    "bumpversion==0.6.0",
    "wheel>=0.46.2",
    "mypy==1.11.1"
]
