[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "snappass"
version = "1.7.0"
description = "It's like SnapChat... for Passwords."
readme = "README.rst"
authors = [
    {name = "Pinterest", email = "joec@pinterest.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Flask>=1.1.1",
    "redis>=4.0.0,<5.0.0",
    "Flask-Babel>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/pinterest/snappass"

[project.scripts]
snappass = "snappass.main:main"
